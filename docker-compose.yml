# =============================================================================
# Global Infrastructure -- production-oriented Docker Compose stack
#
#   cp .env.example .env      # then edit .env
#   docker compose up -d --build
#   docker compose logs -f api
#
# Secrets are never written here; every value comes from .env.
# =============================================================================

name: global-infrastructure

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ght}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ght}
      # Deterministic collation so index ordering is stable across hosts.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Exposed for local inspection only; remove this mapping in production.
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ght} -d ${POSTGRES_DB:-ght}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persistence is not required: Redis holds only rate-limit counters, the
    # short-lived permission cache and the access-token deny list.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [backend]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Runs migrations, seeds the catalogue, then starts the server. Idempotent,
    # so restarting the container is always safe.
    command: ["/app/docker-entrypoint.sh"]
    env_file: [.env]
    environment:
      # Override the .env values that differ inside the Compose network.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ght}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ght}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [backend, frontend]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time -- Vite inlines it into the bundle.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [frontend]

volumes:
  db_data:

networks:
  # `db` and `redis` are only reachable from the API, not from `web`.
  backend:
  frontend:
