[project]
name = "global-infrastructure-api"
version = "0.1.0"
description = "Global Infrastructure -- internal multipurpose helper-tools platform (API)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fixtures must share the test's event loop: asyncpg connections are bound to
# the loop that opened them.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hard-coded test passwords are intentional
"alembic/*" = ["E501"]
